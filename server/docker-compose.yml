# Explicit project name: without it Compose names the project after this folder ("server"),
# which collides with any other repo that keeps its compose file in a folder called server.
name: portfolio-site

services:
  postgres:
    image: postgres:17
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
