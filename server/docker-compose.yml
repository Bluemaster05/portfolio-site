# Explicit project name: without it Compose names the project after this folder ("server"),
# which collides with any other repo that keeps its compose file in a folder called server.
name: portfolio-site

services:
  postgres:
    image: postgres:17
    # Comes back after a reboot or crash (the Docker service starts on boot)
    restart: unless-stopped
    env_file: .env
    ports:
      # Localhost only: Docker-published ports bypass ufw
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
